<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Music & Figma Presentation</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #2c2c2c;
            --accent-color: #0acf83;
            --accent-hover: #09b874;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 0 20px 40px 20px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .figma-wrapper {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        .responsive-iframe {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding-top: 56.25%; /* Соотношение сторон 16:9 */
            border-radius: 8px;
            background-color: #000;
        }

        .responsive-iframe iframe {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            background-color: var(--bg-color);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .player-container {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        audio {
            width: 100%;
            margin-top: 8px;
        }

        .music-frame-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Просмотр прототипа</h1>
    </header>

    <main class="main-container">
        <!-- Левая часть: Прототип Figma -->
        <div class="figma-wrapper">
            <div class="responsive-iframe">
                <iframe src="https://embed.figma.com/proto/P3dMvNIojtmpqSJCCSBuPK/zfdcrGuicgfnojkjl-hlknmj?node-id=9-205&p=f&scaling=scale-down&content-scaling=fixed&page-id=0%3A1&embed-host=share" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Правая часть: Управление музыкой -->
        <div class="sidebar">
            <div class="panel">
                <p class="panel-title">Музыкальное сопровождение</p>
                
                <div class="input-group">
                    <label for="music-url">Ссылка на трек</label>
                    <input type="text" id="music-url" placeholder="Вставьте ссылку (MP3, Яндекс, YouTube, VK)...">
                </div>

                <button class="btn" onclick="loadMusic()">Загрузить и включить</button>

                <div class="player-container">
                    <!-- Локальный плеер для прямых MP3 ссылок -->
                    <audio id="audio-player" controls style="display: none;"></audio>
                    
                    <!-- Контейнер для встраиваемых плееров (Яндекс, YouTube и т.д.) -->
                    <div id="music-frame-container" class="music-frame-wrapper"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function loadMusic() {
            const urlInput = document.getElementById('music-url').value.trim();
            const audioPlayer = document.getElementById('audio-player');
            const frameContainer = document.getElementById('music-frame-container');
            
            // Сбрасываем старые состояния плееров
            audioPlayer.style.display = 'none';
            audioPlayer.pause();
            frameContainer.style.display = 'none';
            frameContainer.innerHTML = '';

            if (!urlInput) {
                alert('Пожалуйста, вставьте ссылку на музыку');
                return;
            }

            // 1. Проверка на прямую ссылку на аудиофайл (mp3, wav, ogg)
            if (urlInput.match(/\.(mp3|wav|ogg)/i) || urlInput.includes('://google.com') && urlInput.includes('export=download')) {
                audioPlayer.src = urlInput;
                audioPlayer.style.display = 'block';
                audioPlayer.play().catch(e => console.log("Автозапуск заблокирован браузером. Нажмите Play вручную."));
            } 
            // 2. Проверка на Яндекс Музыку
            else if (urlInput.includes('music.yandex.ru')) {
                let embedUrl = urlInput.replace('music.yandex.ru/album/', 'music.yandex.ru/iframe/#album/');
                embedUrl = embedUrl.replace('/track/', '/');
                
                frameContainer.innerHTML = `<iframe src="${embedUrl}" width="100%" height="210" frameborder="0"></iframe>`;
                frameContainer.style.display = 'block';
            } 
            // 3. Проверка на YouTube / YouTube Music
            else if (urlInput.includes('youtube.com') || urlInput.includes('youtu.be')) {
                let videoId = '';
                if (urlInput.includes('youtu.be/')) {
                    videoId = urlInput.split('youtu.be/')[1].split('?')[0];
                } else if (urlInput.includes('v=')) {
                    videoId = urlInput.split('v=')[1].split('&')[0];
                }
                
                if (videoId) {
                    frameContainer.innerHTML = `<iframe src="https://youtube.com{videoId}?autoplay=1" width="100%" height="200" allow="autoplay; encrypted-media" frameborder="0"></iframe>`;
                    frameContainer.style.display = 'block';
                } else {
                    alert('Не удалось распознать ID видео YouTube');
                }
            } 
            // 4. Любая другая ссылка — пробуем встроить как стандартный iframe
            else {
                frameContainer.innerHTML = `<iframe src="${urlInput}" width="100%" height="200" frameborder="0"></iframe>`;
                frameContainer.style.display = 'block';
            }
        }
    </script>
</body>
</html>
